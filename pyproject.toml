[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlpost"
version = "0.1.0"
description = "Language-model post-training: supervised fine-tuning, a reward model, PPO, and DPO"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "ML Systems Team", email = "ml-systems@example.com"}
]
keywords = ["rlhf", "reinforcement-learning", "language-models", "distributed-training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "torch>=2.15",
    "transformers>=5.22",
    "datasets>=5.1",
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "trl==1.17.1",
]
lora = [
    "peft>=0.17",
]

[project.urls]
Homepage = "https://github.com/Mattral/rlpost"
Repository = "https://github.com/Mattral/rlpost.git"
Issues = "https://github.com/Mattral/rlpost/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rlpost = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.hg
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
py_version = 311
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["docs"]

[tool.ruff.lint]
# E501 is left to the formatter. UP is not in this gate: the tree still uses
# typing.List and Optional in many files, and rewriting them is not this change.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow and not gpu'"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: test takes long enough to skip in the default CPU job",
    "gpu: test requires a CUDA device",
]

[tool.coverage.run]
branch = true
source = ["src/rlpost"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@abstractmethod",
]
